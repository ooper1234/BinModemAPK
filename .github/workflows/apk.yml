name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android

      - name: Build
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: ./build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: BinModem-apk
          path: BinModem.apk

      - name: Release
        # Tagged pushes release under their own tag; pushes to main, to the
        # Android branch and manual runs get a numbered tag made here.
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ccr-26b84732-r7dqdi' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: BinModem.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.0-android.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: BinModem for Android ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.0-android.{0}', github.run_number) }}
          make_latest: true
          body: |
            Unofficial Android build of [BinModem](https://github.com/CasualArclamp/BinModem) (upstream commit pinned by the `BinModem` submodule).

            * arm64-v8a, Android 8.0 (API 26) or newer
            * Signed with a debug key: uninstall any earlier build before installing
            * File-picker "Browse..." buttons do nothing on Android; type a path instead
